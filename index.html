<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ElettroDiag - Diagnostica Impianti</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00bcd4;
            --text-color: #e0e0e0;
            --danger-color: #f44336;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --border-radius: 12px;
            --spacing: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 80px; /* Spazio per il FAB */
        }

        header {
            background-color: var(--surface-color);
            padding: var(--spacing);
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .back-btn {
            position: absolute;
            left: var(--spacing);
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .container {
            padding: var(--spacing);
            max-width: 600px;
            margin: 0 auto;
        }

        .view {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: var(--spacing);
            margin-bottom: var(--spacing);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            background-color: var(--surface-color);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: var(--border-radius);
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:active {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: var(--spacing);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #aaa;
        }

        input[type="number"], select {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary-color);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 2;
        }

        .input-row select {
            flex: 1;
        }

        .results {
            margin-top: 24px;
            padding: var(--spacing);
            border-radius: var(--border-radius);
            background-color: #222;
            display: none;
        }

        .badge {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 12px;
            width: 100%;
            text-align: center;
        }

        .badge.success { background-color: var(--success-color); color: #fff; }
        .badge.danger { background-color: var(--danger-color); color: #fff; }
        .badge.warning { background-color: var(--warning-color); color: #fff; }

        .panel-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 16px;
            justify-content: center;
        }

        .panel {
            width: 40px;
            height: 40px;
            background-color: #333;
            border: 2px solid #555;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .panel.faulty {
            background-color: var(--danger-color);
            border-color: #ffcccc;
            color: white;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.6);
        }

        /* FAB Button */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: var(--bg-color);
            font-size: 24px;
            font-weight: bold;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            display: none; /* Nascosto nella home */
            align-items: center;
            justify-content: center;
            z-index: 100;
            font-family: serif;
            font-style: italic;
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* Modale Guida */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: flex-end;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: var(--surface-color);
            width: 100%;
            max-width: 600px;
            height: 85vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 24px;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease-out;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background-color: #333;
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 210;
        }

        .modal-body h2 {
            color: var(--primary-color);
            margin-bottom: 16px;
            font-size: 1.4rem;
        }

        .modal-body h3 {
            color: #fff;
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 1.1rem;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }

        .modal-body ul {
            padding-left: 20px;
            margin-bottom: 16px;
        }

        .modal-body li {
            margin-bottom: 8px;
            color: #ccc;
        }

        .modal-body strong {
            color: #fff;
        }

        .highlight-box {
            background-color: rgba(255, 152, 0, 0.1);
            border-left: 4px solid var(--warning-color);
            padding: 12px;
            border-radius: 0 8px 8px 0;
            margin-top: 24px;
            margin-bottom: 24px;
        }
        .highlight-box h3 {
            color: var(--warning-color);
            border: none;
            margin-top: 0;
        }
        .highlight-box p {
            margin-bottom: 12px;
            color: #ddd;
        }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" id="backBtn" onclick="goHome()">&#8592;</button>
        <h1 id="headerTitle">ElettroDiag</h1>
    </header>

    <div class="container">
        <!-- HOME VIEW -->
        <div id="homeView" class="view active">
            <h2 style="margin-bottom: 24px; text-align: center; font-size: 1.2rem; color: #aaa;">Seleziona lo strumento</h2>
            <button class="btn" onclick="openView('pvView', 'Dispersione Stringa FV')">
                ☀️ Dispersione Stringa FV
                <div style="font-size: 0.8rem; font-weight: normal; margin-top: 6px; color: #aaa;">Localizzazione guasto a terra pannelli</div>
            </button>
            <button class="btn" onclick="openView('cableView', 'Isolamento Cavo')">
                ⚡ Isolamento Cavo Elettrico
                <div style="font-size: 0.8rem; font-weight: normal; margin-top: 6px; color: #aaa;">Verifica Megger / CEI 64-8</div>
            </button>
        </div>

        <!-- PV STRING VIEW -->
        <div id="pvView" class="view">
            <div class="card">
                <div class="form-group">
                    <label>Numero totale di moduli nella stringa (N)</label>
                    <input type="number" id="pv_n" inputmode="numeric" placeholder="Es. 15">
                </div>
                <div class="form-group">
                    <label>Tensione a vuoto totale stringa (Voc in Volt)</label>
                    <input type="number" id="pv_voc" inputmode="decimal" step="any" placeholder="Es. 600">
                </div>
                <div class="form-group">
                    <label>Tensione rilevata V(+) verso Terra (Volt)</label>
                    <input type="number" id="pv_vpos" inputmode="decimal" step="any" placeholder="Valore assoluto, es. 400">
                </div>
                <div class="form-group">
                    <label>Tensione rilevata V(-) verso Terra (Volt)</label>
                    <input type="number" id="pv_vneg" inputmode="decimal" step="any" placeholder="Valore assoluto, es. 200">
                </div>
                <button class="btn btn-primary" onclick="calculatePV()">Analizza Guasto</button>
            </div>

            <div id="pvResults" class="results card">
                <div id="pvBadge" class="badge"></div>
                <p id="pvReport" style="margin-bottom: 16px;"></p>
                <div id="pvGraphic" class="panel-container"></div>
                <p style="margin-top:16px; font-size:0.8rem; color:#888;">* I moduli sono numerati partendo dal connettore Positivo (+) verso il Negativo (-).</p>
            </div>
        </div>

        <!-- CABLE INSULATION VIEW -->
        <div id="cableView" class="view">
            <div class="card">
                <div class="form-group">
                    <label>Tensione di prova Megger (V DC)</label>
                    <select id="cable_vtest" onchange="toggleCustomVTest()">
                        <option value="250">250 V (SELV/PELV)</option>
                        <option value="500" selected>500 V (Fino a 500V)</option>
                        <option value="1000">1000 V (Oltre 500V)</option>
                        <option value="custom">Altro (Specificare)</option>
                    </select>
                </div>
                <div class="form-group" id="custom_vtest_group" style="display: none;">
                    <label>Tensione personalizzata (V DC)</label>
                    <input type="number" id="cable_vtest_custom" inputmode="numeric" placeholder="Es. 5000">
                </div>
                <div class="form-group">
                    <label>Resistenza d'isolamento rilevata</label>
                    <div class="input-row">
                        <input type="number" id="cable_r" inputmode="decimal" step="any" placeholder="Valore">
                        <select id="cable_unit">
                            <option value="1e-6">Ω</option>
                            <option value="1e-3">kΩ</option>
                            <option value="1" selected>MΩ</option>
                            <option value="1000">GΩ</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Lunghezza del cavo (Metri)</label>
                    <input type="number" id="cable_l" inputmode="decimal" step="any" placeholder="Es. 150">
                </div>
                <div class="form-group">
                    <label>Sezione conduttori (mm²) [Opzionale]</label>
                    <input type="number" id="cable_s" inputmode="decimal" step="any" placeholder="Es. 6">
                </div>
                <button class="btn btn-primary" onclick="calculateCable()">Verifica Conformità</button>
            </div>

            <div id="cableResults" class="results card">
                <div id="cableBadge" class="badge"></div>
                <p id="cableReport" style="margin-bottom: 12px;"></p>
                <div style="background-color: #333; padding: 12px; border-radius: 8px; font-size: 0.9rem;">
                    <strong>Dettagli Tecnici:</strong><br>
                    - R misurata: <span id="res_misurata"></span> MΩ<br>
                    - Soglia normativa: <span id="res_soglia"></span> MΩ<br>
                    - R Specifica: <span id="res_km"></span> MΩ·km
                </div>
                <p id="cableNotes" style="margin-top:12px; font-size:0.85rem; color:#aaa;"></p>
            </div>
        </div>
    </div>

    <!-- FAB Button per Info -->
    <button id="infoFab" class="fab" onclick="openModal()">i</button>

    <!-- Modale Guida Overlay -->
    <div id="guideModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">X</button>
            <div id="modalBody" class="modal-body">
                <!-- Il contenuto della guida verrà iniettato qui da JS -->
            </div>
        </div>
    </div>

    <script>
        // --- TESTI DELLE GUIDE ---
        const guidePV = `
            <h2>Guida: Misurazione Dispersione Stringa FV</h2>
            
            <h3>1. Sicurezza e DPI</h3>
            <ul>
                <li><strong>Dispositivi di Protezione Individuale (DPI):</strong> Indossare guanti dielettrici (es. Classe 0 per 1000V), calzature isolanti e occhiali/visiera.</li>
                <li>Operare su circuito aperto (sezionato dall'inverter).</li>
            </ul>

            <h3>2. Impostazione e Misurazione</h3>
            <ul>
                <li><strong>Strumento:</strong> Impostare il multimetro sulla misurazione di Tensione in Corrente Continua (V DC).</li>
                <li><strong>Voc (Tensione a vuoto totale):</strong> Posizionare i puntali tra il polo positivo e il polo negativo della stringa. Registrare il valore.</li>
                <li><strong>V(+) verso Terra:</strong> Mantenere un puntale sul polo positivo della stringa e posizionare l'altro direttamente sul morsetto di terra (PE) dell'impianto. Registrare il valore assoluto.</li>
                <li><strong>V(-) verso Terra:</strong> Posizionare un puntale sul polo negativo della stringa e mantenere l'altro a terra. Registrare il valore assoluto.</li>
            </ul>

            <div class="highlight-box">
                <h3>Capitolo Specifico: Impianti con Ottimizzatori (es. Tigo)</h3>
                <p><strong>Perché la formula non si applica:</strong> La presenza di ottimizzatori annulla la ripartizione lineare della tensione. I convertitori DC/DC alterano i valori per l'MPPT, ed entra in gioco la funzione di <em>Rapid Shutdown</em> (tensione azzerata o limitata a 1V) se manca il segnale dell'inverter o del datalogger, rendendo inaffidabile la lettura ai capi della stringa.</p>
                <p><strong>Procedure operative per la localizzazione:</strong></p>
                <ul>
                    <li><strong>Verifica da Portale:</strong> Accedere al monitoraggio (es. Tigo EI). Il modulo guasto andrà spesso offline o in protezione termica/elettrica, risultando facilmente individuabile a schermo.</li>
                    <li><strong>Divide et Impera:</strong> Se la ricerca software non è possibile, salire sul tetto e sezionare fisicamente la stringa a metà. Testare l'isolamento delle due metà verso terra con il Megger. Procedere frazionando ulteriormente la metà in difetto fino a isolare il blocco incriminato.</li>
                    <li><strong>Test del singolo blocco:</strong> Isolata la coppia sospetta, scollegare l'ottimizzatore dal pannello fotovoltaico. Testarli separatamente per individuare il componente responsabile. <em>Verificare sempre nei manuali le tensioni massime di test per non danneggiare l'elettronica dell'ottimizzatore.</em></li>
                </ul>
            </div>
        `;

        const guideCable = `
            <h2>Guida: Verifica Isolamento Cavo Elettrico</h2>
            
            <h3>1. Sicurezza Preliminare</h3>
            <ul>
                <li><strong>Fuori Tensione:</strong> L'impianto <strong>DEVE</strong> essere completamente sezionato dalla rete elettrica. Prima di iniziare, verificare l'assenza di tensione tra tutti i conduttori con un tester.</li>
            </ul>

            <h3>2. Preparazione dell'Impianto</h3>
            <ul>
                <li><strong>Scollegamento Carichi:</strong> È tassativo staccare fisicamente tutti gli utilizzatori (elettrodomestici, lampade).</li>
                <li><strong>Salvaguardia Elettronica:</strong> Scollegare o bypassare obbligatoriamente driver LED, inverter, UPS, schede elettroniche e scaricatori di sovratensione (SPD). Lasciarli connessi <strong>causerà danni irreversibili</strong> dovuti all'alta tensione iniettata dal Megger.</li>
            </ul>

            <h3>3. Esecuzione del Test</h3>
            <ul>
                <li><strong>Collegamento Puntali:</strong> Collegare i puntali dello strumento (es. Linea/Neutro cortocircuitati misurati verso il PE, oppure singolarmente conduttore attivo verso terra, o tra conduttori attivi).</li>
                <li><strong>Iniezione Tensione:</strong> Impostare il misuratore d'isolamento alla tensione prevista dalla normativa (es. 500V DC per i normali circuiti civili 230/400V) e avviare il test.</li>
                <li><strong>Stabilizzazione:</strong> Mantenere la misurazione attiva fino a quando il valore sul display non si stabilizza (capacità del cavo carica).</li>
            </ul>

            <h3>4. Conclusione del Test</h3>
            <ul>
                <li><strong>Scarica Capacitiva:</strong> A fine prova, il cavo rimane carico come un condensatore ad alta tensione. <strong>Non toccare i conduttori!</strong> Attendere la scarica automatica (se prevista dallo strumento) oppure scaricare i conduttori collegandoli a terra prima di manipolarli.</li>
            </ul>
        `;

        // --- NAVIGATION LOGIC ---
        let currentActiveView = '';

        function openView(viewId, title) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            document.getElementById('headerTitle').innerText = title;
            document.getElementById('backBtn').style.display = 'block';
            
            // Gestione FAB e Variabile stato
            currentActiveView = viewId;
            document.getElementById('infoFab').style.display = 'flex';
            
            // Nascondi i risultati precedenti
            document.getElementById('pvResults').style.display = 'none';
            document.getElementById('cableResults').style.display = 'none';
        }

        function goHome() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('homeView').classList.add('active');
            document.getElementById('headerTitle').innerText = 'ElettroDiag';
            document.getElementById('backBtn').style.display = 'none';
            
            currentActiveView = '';
            document.getElementById('infoFab').style.display = 'none';
        }

        // --- MODAL LOGIC ---
        function openModal() {
            const modalBody = document.getElementById('modalBody');
            if (currentActiveView === 'pvView') {
                modalBody.innerHTML = guidePV;
            } else if (currentActiveView === 'cableView') {
                modalBody.innerHTML = guideCable;
            }
            document.getElementById('guideModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('guideModal').style.display = 'none';
        }

        // Chiudi il modale se l'utente clicca fuori dal contenuto
        document.getElementById('guideModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // --- PV STRING LOGIC ---
        function calculatePV() {
            const n = parseInt(document.getElementById('pv_n').value);
            const voc = parseFloat(document.getElementById('pv_voc').value);
            const vpos = Math.abs(parseFloat(document.getElementById('pv_vpos').value));
            const vneg = Math.abs(parseFloat(document.getElementById('pv_vneg').value));

            if (!n || !voc || isNaN(vpos) || isNaN(vneg)) {
                alert("Inserisci tutti i parametri della stringa fotovoltaica.");
                return;
            }

            const resultsDiv = document.getElementById('pvResults');
            const badge = document.getElementById('pvBadge');
            const report = document.getElementById('pvReport');
            const graphic = document.getElementById('pvGraphic');

            resultsDiv.style.display = 'block';
            graphic.innerHTML = '';

            const sumV = vpos + vneg;
            const toleranceMin = voc * 0.90;
            const toleranceMax = voc * 1.10;

            if (sumV >= toleranceMin && sumV <= toleranceMax) {
                badge.className = 'badge danger';
                badge.innerText = 'DISPERSIONE RILEVATA';
                
                const faultRatio = vpos / voc;
                let faultyPanel = Math.round(faultRatio * n);
                
                if (faultyPanel === 0) {
                    report.innerHTML = "Il guasto a terra si trova sul <strong>cavo di Ritorno Positivo (+)</strong> o in prossimità immediata del <strong>MODULO 1</strong>.";
                    faultyPanel = 1; 
                } else if (faultyPanel > n) {
                    report.innerHTML = "Il guasto a terra si trova sul <strong>cavo di Ritorno Negativo (-)</strong> o oltre l'ultimo pannello.";
                    faultyPanel = n;
                } else {
                    report.innerHTML = `Il guasto a terra si trova presumibilmente sul <strong>MODULO n. ${faultyPanel}</strong> (contando dal connettore Positivo).`;
                }

                for (let i = 1; i <= n; i++) {
                    const panelDiv = document.createElement('div');
                    panelDiv.className = 'panel' + (i === faultyPanel ? ' faulty' : '');
                    panelDiv.innerText = i;
                    graphic.appendChild(panelDiv);
                }
            } else {
                badge.className = 'badge success';
                badge.innerText = 'NESSUNA DISPERSIONE FRANCA';
                report.innerHTML = "La somma delle tensioni verso terra ("+sumV.toFixed(1)+"V) non corrisponde alla Voc della stringa ("+voc+"V).<br><br><strong>Conclusione:</strong> Isolamento Normale. Le tensioni rilevate sono fluttuazioni elettrostatiche.";
                
                for (let i = 1; i <= n; i++) {
                    const panelDiv = document.createElement('div');
                    panelDiv.className = 'panel';
                    panelDiv.innerText = i;
                    graphic.appendChild(panelDiv);
                }
            }
        }

        // --- CABLE INSULATION LOGIC ---
        function toggleCustomVTest() {
            const select = document.getElementById('cable_vtest');
            const customGroup = document.getElementById('custom_vtest_group');
            if (select.value === 'custom') {
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
            }
        }

        function calculateCable() {
            let vtest = document.getElementById('cable_vtest').value;
            if (vtest === 'custom') {
                vtest = document.getElementById('cable_vtest_custom').value;
            }
            vtest = parseFloat(vtest);

            const r_val = parseFloat(document.getElementById('cable_r').value);
            const r_unit_multiplier = parseFloat(document.getElementById('cable_unit').value);
            const l = parseFloat(document.getElementById('cable_l').value);
            
            if (isNaN(vtest) || isNaN(r_val) || isNaN(l)) {
                alert("Compila tutti i campi obbligatori (Tensione, Resistenza, Lunghezza).");
                return;
            }

            const r_megaOhm = r_val * r_unit_multiplier;
            
            let r_min_megaOhm = 1.0;
            if (vtest <= 250) {
                r_min_megaOhm = 0.5;
            } else if (vtest <= 1000) {
                r_min_megaOhm = 1.0;
            }

            const r_km = r_megaOhm * (l / 1000);

            const resultsDiv = document.getElementById('cableResults');
            const badge = document.getElementById('cableBadge');
            const report = document.getElementById('cableReport');
            const notes = document.getElementById('cableNotes');

            resultsDiv.style.display = 'block';
            document.getElementById('res_misurata').innerText = r_megaOhm >= 1000 ? r_megaOhm.toExponential(2) : r_megaOhm.toFixed(2);
            document.getElementById('res_soglia').innerText = r_min_megaOhm.toFixed(2);
            document.getElementById('res_km').innerText = r_km >= 1000 ? r_km.toExponential(2) : r_km.toFixed(2);

            if (r_megaOhm < r_min_megaOhm) {
                badge.className = 'badge danger';
                badge.innerText = "GUASTO D'ISOLAMENTO";
                report.innerHTML = "<strong>CRITICO:</strong> La resistenza misurata è INFERIORE al limite minimo normativo prescritto dalla CEI 64-8.";
                notes.innerText = "Raccomandazione: Sezionare la linea e ripetere la misurazione per isolare il punto di guasto.";
            } else {
                if (r_km < (r_min_megaOhm * 2)) {
                    badge.className = 'badge warning';
                    badge.innerText = "ISOLAMENTO DEGRADATO (A NORMA)";
                    report.innerHTML = "<strong>ATTENZIONE:</strong> Il valore globale supera il limite minimo, ma l'isolamento specifico risulta degradato.";
                    notes.innerText = "Raccomandazione: La linea è formalmente a norma ma presenta micro-infiltrazioni o degrado guaina.";
                } else {
                    badge.className = 'badge success';
                    badge.innerText = "LINEA CONFORME";
                    report.innerHTML = "<strong>OTTIMO:</strong> La resistenza d'isolamento rispetta i limiti normativi CEI 64-8 ed è adeguata alla lunghezza della tratta.";
                    notes.innerText = "Nota: Test valido a condizione che tutti i carichi fossero scollegati dal circuito.";
                }
            }
        }
    </script>
</body>
</html>
