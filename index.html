<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ElettroDiag - Diagnostica Impianti</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00bcd4;
            --text-color: #e0e0e0;
            --danger-color: #f44336;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --border-radius: 12px;
            --spacing: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 30px;
        }

        header {
            background-color: var(--surface-color);
            padding: var(--spacing);
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .back-btn {
            position: absolute;
            left: var(--spacing);
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .container {
            padding: var(--spacing);
            max-width: 600px;
            margin: 0 auto;
        }

        .view {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: var(--spacing);
            margin-bottom: var(--spacing);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            background-color: var(--surface-color);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: var(--border-radius);
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:active {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: var(--spacing);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #aaa;
        }

        input[type="number"], select {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary-color);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 2;
        }

        .input-row select {
            flex: 1;
        }

        .results {
            margin-top: 24px;
            padding: var(--spacing);
            border-radius: var(--border-radius);
            background-color: #222;
            display: none;
        }

        .badge {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 12px;
            width: 100%;
            text-align: center;
        }

        .badge.success { background-color: var(--success-color); color: #fff; }
        .badge.danger { background-color: var(--danger-color); color: #fff; }
        .badge.warning { background-color: var(--warning-color); color: #fff; }

        .panel-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 16px;
            justify-content: center;
        }

        .panel {
            width: 40px;
            height: 40px;
            background-color: #333;
            border: 2px solid #555;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .panel.faulty {
            background-color: var(--danger-color);
            border-color: #ffcccc;
            color: white;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.6);
        }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" id="backBtn" onclick="goHome()">&#8592;</button>
        <h1 id="headerTitle">ElettroDiag</h1>
    </header>

    <div class="container">
        <!-- HOME VIEW -->
        <div id="homeView" class="view active">
            <h2 style="margin-bottom: 24px; text-align: center; font-size: 1.2rem; color: #aaa;">Seleziona lo strumento</h2>
            <button class="btn" onclick="openView('pvView', 'Dispersione Stringa FV')">
                ☀️ Dispersione Stringa FV
                <div style="font-size: 0.8rem; font-weight: normal; margin-top: 6px; color: #aaa;">Localizzazione guasto a terra pannelli</div>
            </button>
            <button class="btn" onclick="openView('cableView', 'Isolamento Cavo')">
                ⚡ Isolamento Cavo Elettrico
                <div style="font-size: 0.8rem; font-weight: normal; margin-top: 6px; color: #aaa;">Verifica Megger / CEI 64-8</div>
            </button>
        </div>

        <!-- PV STRING VIEW -->
        <div id="pvView" class="view">
            <div class="card">
                <div class="form-group">
                    <label>Numero totale di moduli nella stringa (N)</label>
                    <input type="number" id="pv_n" inputmode="numeric" placeholder="Es. 15">
                </div>
                <div class="form-group">
                    <label>Tensione a vuoto totale stringa (Voc in Volt)</label>
                    <input type="number" id="pv_voc" inputmode="decimal" step="any" placeholder="Es. 600">
                </div>
                <div class="form-group">
                    <label>Tensione rilevata V(+) verso Terra (Volt)</label>
                    <input type="number" id="pv_vpos" inputmode="decimal" step="any" placeholder="Valore assoluto, es. 400">
                </div>
                <div class="form-group">
                    <label>Tensione rilevata V(-) verso Terra (Volt)</label>
                    <input type="number" id="pv_vneg" inputmode="decimal" step="any" placeholder="Valore assoluto, es. 200">
                </div>
                <button class="btn btn-primary" onclick="calculatePV()">Analizza Guasto</button>
            </div>

            <div id="pvResults" class="results card">
                <div id="pvBadge" class="badge"></div>
                <p id="pvReport" style="margin-bottom: 16px;"></p>
                <div id="pvGraphic" class="panel-container"></div>
                <p style="margin-top:16px; font-size:0.8rem; color:#888;">* I moduli sono numerati partendo dal connettore Positivo (+) verso il Negativo (-).</p>
            </div>
        </div>

        <!-- CABLE INSULATION VIEW -->
        <div id="cableView" class="view">
            <div class="card">
                <div class="form-group">
                    <label>Tensione di prova Megger (V DC)</label>
                    <select id="cable_vtest" onchange="toggleCustomVTest()">
                        <option value="250">250 V (SELV/PELV)</option>
                        <option value="500" selected>500 V (Fino a 500V)</option>
                        <option value="1000">1000 V (Oltre 500V)</option>
                        <option value="custom">Altro (Specificare)</option>
                    </select>
                </div>
                <div class="form-group" id="custom_vtest_group" style="display: none;">
                    <label>Tensione personalizzata (V DC)</label>
                    <input type="number" id="cable_vtest_custom" inputmode="numeric" placeholder="Es. 5000">
                </div>
                <div class="form-group">
                    <label>Resistenza d'isolamento rilevata</label>
                    <div class="input-row">
                        <input type="number" id="cable_r" inputmode="decimal" step="any" placeholder="Valore">
                        <select id="cable_unit">
                            <option value="1e-6">Ω</option>
                            <option value="1e-3">kΩ</option>
                            <option value="1" selected>MΩ</option>
                            <option value="1000">GΩ</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Lunghezza del cavo (Metri)</label>
                    <input type="number" id="cable_l" inputmode="decimal" step="any" placeholder="Es. 150">
                </div>
                <div class="form-group">
                    <label>Sezione conduttori (mm²) [Opzionale per calcolo]</label>
                    <input type="number" id="cable_s" inputmode="decimal" step="any" placeholder="Es. 6">
                </div>
                <button class="btn btn-primary" onclick="calculateCable()">Verifica Conformità</button>
            </div>

            <div id="cableResults" class="results card">
                <div id="cableBadge" class="badge"></div>
                <p id="cableReport" style="margin-bottom: 12px;"></p>
                <div style="background-color: #333; padding: 12px; border-radius: 8px; font-size: 0.9rem;">
                    <strong>Dettagli Tecnici:</strong><br>
                    - R misurata: <span id="res_misurata"></span> MΩ<br>
                    - Soglia CEI 64-8: <span id="res_soglia"></span> MΩ<br>
                    - R Specifica normalizzata: <span id="res_km"></span> MΩ·km
                </div>
                <p id="cableNotes" style="margin-top:12px; font-size:0.85rem; color:#aaa;"></p>
            </div>
        </div>
    </div>

    <script>
        // --- NAVIGATION LOGIC ---
        function openView(viewId, title) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            document.getElementById('headerTitle').innerText = title;
            document.getElementById('backBtn').style.display = 'block';
            
            // Nascondi i risultati precedenti
            document.getElementById('pvResults').style.display = 'none';
            document.getElementById('cableResults').style.display = 'none';
        }

        function goHome() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('homeView').classList.add('active');
            document.getElementById('headerTitle').innerText = 'ElettroDiag';
            document.getElementById('backBtn').style.display = 'none';
        }

        // --- PV STRING LOGIC ---
        function calculatePV() {
            const n = parseInt(document.getElementById('pv_n').value);
            const voc = parseFloat(document.getElementById('pv_voc').value);
            const vpos = Math.abs(parseFloat(document.getElementById('pv_vpos').value));
            const vneg = Math.abs(parseFloat(document.getElementById('pv_vneg').value));

            if (!n || !voc || isNaN(vpos) || isNaN(vneg)) {
                alert("Inserisci tutti i parametri della stringa fotovoltaica.");
                return;
            }

            const resultsDiv = document.getElementById('pvResults');
            const badge = document.getElementById('pvBadge');
            const report = document.getElementById('pvReport');
            const graphic = document.getElementById('pvGraphic');

            resultsDiv.style.display = 'block';
            graphic.innerHTML = '';

            const sumV = vpos + vneg;
            const toleranceMin = voc * 0.90;
            const toleranceMax = voc * 1.10;

            if (sumV >= toleranceMin && sumV <= toleranceMax) {
                // Guasto a terra netto rilevato
                badge.className = 'badge danger';
                badge.innerText = 'DISPERSIONE RILEVATA';
                
                // Calcolo posizione
                const faultRatio = vpos / voc;
                let faultyPanel = Math.round(faultRatio * n);
                
                // Edge cases
                if (faultyPanel === 0) {
                    report.innerHTML = "Il guasto a terra si trova sul <strong>cavo di Ritorno Positivo (+)</strong> o in prossimità immediata del <strong>MODULO 1</strong>.";
                    faultyPanel = 1; 
                } else if (faultyPanel > n) {
                    report.innerHTML = "Il guasto a terra si trova sul <strong>cavo di Ritorno Negativo (-)</strong> o oltre l'ultimo pannello.";
                    faultyPanel = n;
                } else {
                    report.innerHTML = `Il guasto a terra si trova presumibilmente sul <strong>MODULO n. ${faultyPanel}</strong> (contando dal connettore Positivo).`;
                }

                // Generazione Grafica Pannelli
                for (let i = 1; i <= n; i++) {
                    const panelDiv = document.createElement('div');
                    panelDiv.className = 'panel' + (i === faultyPanel ? ' faulty' : '');
                    panelDiv.innerText = i;
                    graphic.appendChild(panelDiv);
                }
            } else {
                // Isolamento normale o tensioni "fantasma"
                badge.className = 'badge success';
                badge.innerText = 'NESSUNA DISPERSIONE FRANCA';
                report.innerHTML = "La somma delle tensioni verso terra ("+sumV.toFixed(1)+"V) non corrisponde alla Voc della stringa ("+voc+"V).<br><br><strong>Conclusione:</strong> Isolamento Normale. Le tensioni rilevate sono probabilmente dovute a fluttuazioni capacitivo-elettrostatiche (scaricano a 0V tenendo i puntali collegati).";
                
                // Mostra i pannelli tutti sani
                for (let i = 1; i <= n; i++) {
                    const panelDiv = document.createElement('div');
                    panelDiv.className = 'panel';
                    panelDiv.innerText = i;
                    graphic.appendChild(panelDiv);
                }
            }
        }

        // --- CABLE INSULATION LOGIC ---
        function toggleCustomVTest() {
            const select = document.getElementById('cable_vtest');
            const customGroup = document.getElementById('custom_vtest_group');
            if (select.value === 'custom') {
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
            }
        }

        function calculateCable() {
            let vtest = document.getElementById('cable_vtest').value;
            if (vtest === 'custom') {
                vtest = document.getElementById('cable_vtest_custom').value;
            }
            vtest = parseFloat(vtest);

            const r_val = parseFloat(document.getElementById('cable_r').value);
            const r_unit_multiplier = parseFloat(document.getElementById('cable_unit').value);
            const l = parseFloat(document.getElementById('cable_l').value);
            
            if (isNaN(vtest) || isNaN(r_val) || isNaN(l)) {
                alert("Compila tutti i campi obbligatori (Tensione, Resistenza, Lunghezza).");
                return;
            }

            // Calcolo Resistenza in MegaOhm
            const r_megaOhm = r_val * r_unit_multiplier;
            
            // Soglia normativa CEI 64-8
            let r_min_megaOhm = 1.0;
            if (vtest <= 250) {
                r_min_megaOhm = 0.5;
            } else if (vtest <= 1000) {
                r_min_megaOhm = 1.0;
            } else {
                r_min_megaOhm = 1.0; // Standard fallback
            }

            // Resistenza specifica normalizzata a Km
            const r_km = r_megaOhm * (l / 1000);

            const resultsDiv = document.getElementById('cableResults');
            const badge = document.getElementById('cableBadge');
            const report = document.getElementById('cableReport');
            const notes = document.getElementById('cableNotes');

            resultsDiv.style.display = 'block';
            document.getElementById('res_misurata').innerText = r_megaOhm >= 1000 ? r_megaOhm.toExponential(2) : r_megaOhm.toFixed(2);
            document.getElementById('res_soglia').innerText = r_min_megaOhm.toFixed(2);
            document.getElementById('res_km').innerText = r_km >= 1000 ? r_km.toExponential(2) : r_km.toFixed(2);

            if (r_megaOhm < r_min_megaOhm) {
                badge.className = 'badge danger';
                badge.innerText = "GUASTO D'ISOLAMENTO";
                report.innerHTML = "<strong>CRITICO:</strong> La resistenza misurata è INFERIORE al limite minimo normativo prescritto dalla CEI 64-8 per la tensione applicata.";
                notes.innerText = "Raccomandazione: Sezionare la linea, scollegare i carichi intermedi e ripetere la misurazione per isolare il punto di guasto.";
            } else {
                // Controllo warning per linee lunghe o usura
                if (r_km < (r_min_megaOhm * 2)) {
                    badge.className = 'badge warning';
                    badge.innerText = "ISOLAMENTO DEGRADATO (A NORMA)";
                    report.innerHTML = "<strong>ATTENZIONE:</strong> Il valore globale supera il limite minimo, ma calcolando la resistenza specifica al chilometro l'isolamento risulta degradato.";
                    notes.innerText = "Raccomandazione: La linea è formalmente a norma, ma potrebbe presentare micro-infiltrazioni di umidità o degrado della guaina. Da monitorare.";
                } else {
                    badge.className = 'badge success';
                    badge.innerText = "LINEA CONFORME";
                    report.innerHTML = "<strong>OTTIMO:</strong> La resistenza d'isolamento rispetta i limiti normativi CEI 64-8 ed è adeguata alla lunghezza della tratta.";
                    notes.innerText = "Nota: La misurazione è valida a patto che tutti gli utilizzatori (elettrodomestici, driver LED, scaricatori SPD) siano stati preventivamente scollegati dal circuito in test.";
                }
            }
        }
    </script>
</body>
</html>
